stages:
  - build
  - deploy

build:
  stage: build
  tags: [shell]
  script:
    - docker build --platform linux/amd64 -f Dockerfile.deploy -t kavita:custom .
    - docker save kavita:custom | gzip > kavita-docker.tar.gz
  artifacts:
    paths:
      - kavita-docker.tar.gz
    expire_in: 1 day
  when: manual

deploy:
  stage: deploy
  tags: [shell]
  needs: [build]
  script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - scp -o StrictHostKeyChecking=no kavita-docker.tar.gz root@192.168.0.75:/tmp/
    - ssh -o StrictHostKeyChecking=no root@192.168.0.75 "
        docker stop kavita || true &&
        docker rm kavita || true &&
        docker load < /tmp/kavita-docker.tar.gz &&
        docker run -d --name kavita -p 6000:5000
          -v /mnt/ebooks:/manga
          -v /root/kavita:/kavita/config
          --restart unless-stopped kavita:custom &&
        rm /tmp/kavita-docker.tar.gz"
  when: manual
